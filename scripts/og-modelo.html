<!doctype html>
<!-- Modelo da imagem de compartilhamento (Open Graph, 1200x630). Gerada em PNG por scripts/gerar-og.mjs, que
     fotografa esta página com o Edge/Chrome sem interface. Usa as MESMAS fontes do site (EB Garamond e Inter,
     das pastas do @fontsource) e o logo GW em SVG. Cores = variáveis da paleta (nude, bordô, marsala). -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'EB Garamond'; font-weight: 500; src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'EB Garamond'; font-weight: 600; src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter Variable'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
      :root { --cor-primaria: #7a1f2b; --cor-secundaria: #8c4a4a; --cor-destaque: #ddbfb5; --cor-fundo: #f7f1eb; --cor-fundo-alt: #eadfd4; }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--cor-fundo); text-align: center;
      }
      /* brilho rosé suave atrás do logo, como na Abertura do site */
      body::before { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 36%, color-mix(in srgb, var(--cor-destaque) 55%, transparent) 0%, transparent 62%); content: ''; }
      .logo { position: relative; width: 250px; height: auto; margin-bottom: 30px; }
      .rotulo { position: relative; margin-bottom: 22px; color: var(--cor-secundaria); font: 500 22px 'Inter Variable', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; }
      .slogan { position: relative; max-width: 940px; color: var(--cor-primaria); font: 600 62px/1.12 'EB Garamond', serif; text-wrap: balance; }
    </style>
  </head>
  <body>
    <img class="logo" src="../public/midia/logo/logo-gw.svg" alt="" />
    <div class="rotulo">Método NaLift</div>
    <div class="slogan">Cuidar, sustentar e rejuvenescer, sem deixar de ser você.</div>
  </body>
</html>
